id = "fun.fiddy.console"
name = "Fiddy Console"
version = "0.1.0"
min_herdr_version = "0.9.0"
description = "Your Snapchain node, one button away: live status, sync, logs, lifecycle, operator FID, upgrades, settings, and the real Grafana dashboard inside Ovis."
platforms = ["macos", "linux", "windows"]

[[actions]]
id = "open-console"
title = "Fiddy: Open node console"
contexts = ["workspace"]
command = ["python3", "console/herdr_action.py", "console"]
platforms = ["macos", "linux"]

[[actions]]
id = "status"
title = "Fiddy: Live node status"
contexts = ["workspace"]
command = ["python3", "console/herdr_action.py", "status"]
platforms = ["macos", "linux"]

[[actions]]
id = "logs"
title = "Fiddy: Node logs"
contexts = ["workspace"]
command = ["python3", "console/herdr_action.py", "logs"]
platforms = ["macos", "linux"]

[[actions]]
id = "start"
title = "Fiddy: Start node"
contexts = ["workspace"]
command = ["python3", "console/herdr_action.py", "start"]
platforms = ["macos", "linux"]

[[actions]]
id = "stop"
title = "Fiddy: Stop node"
contexts = ["workspace"]
command = ["python3", "console/herdr_action.py", "stop"]
platforms = ["macos", "linux"]

[[actions]]
id = "grafana"
title = "Fiddy: Open Grafana dashboard"
contexts = ["workspace"]
command = ["python3", "console/herdr_action.py", "grafana"]
platforms = ["macos", "linux"]

[[actions]]
id = "fid-setup"
title = "Fiddy: Set operator FID"
contexts = ["workspace"]
command = ["python3", "console/herdr_action.py", "fid-setup"]
platforms = ["macos", "linux"]

[[actions]]
id = "settings"
title = "Fiddy: Node settings"
contexts = ["workspace"]
command = ["python3", "console/herdr_action.py", "settings"]
platforms = ["macos", "linux"]

[[actions]]
id = "auto-upgrade"
title = "Fiddy: Auto-upgrade schedule"
contexts = ["workspace"]
command = ["python3", "console/herdr_action.py", "auto-upgrade"]
platforms = ["macos", "linux"]

