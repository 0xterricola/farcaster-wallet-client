# Per-page unfurl cards (docs/CLIENT-PER-PAGE-CARDS.md). HTML answers carry
    # no-transform: the page is delivered exactly as we built it; the CDN may not
    # add scripts to it. JSON and images keep their existing cache policy.
    # Per-page unfurl cards (docs/CLIENT-PER-PAGE-CARDS.md). fiddy.fun answers
    # one static document for every route — the client is an SPA — so a shared
    # cast or profile link used to unfurl as the front door. fiddy-unfurl.service
    # (loopback 3220) answers these two route families with the release's OWN
    # shell plus that page's og: tags and a 1200x630 card drawn for it, and
    # /unfurl/ serves those cards and the cast-hash index the client reads when
    # a shared link is the first page it has ever opened.
    #
    # If the service is down the page is still the app: the named location below
    # serves the shell, which is exactly what this host served before the service
    # existed. The header set is the shell's own (script-src 'self' and all), and
    # the upstream's copies of the two headers that would otherwise be sent twice
    # are hidden first.
    location ~ ^/~/(conversations|profiles)/ {
        proxy_pass http://127.0.0.1:3220;
        proxy_set_header Host fiddy.fun;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_http_version 1.1;
        proxy_read_timeout 15s;
        proxy_hide_header x-content-type-options;
        proxy_hide_header Cache-Control;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; media-src 'self' blob: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https: wss:; frame-src 'self' https:; object-src 'none'; base-uri 'self'; form-action 'self'" always;
        add_header Cache-Control "public, max-age=300, no-transform" always;
        error_page 502 503 504 = @fiddy_shell;
    }
    # A SHARED LOOK (card t_d85d8520): `POST /look` stores a checked look once and
    # answers its id; `GET /look/<id>` is the page a link unfurls as (the same
    # shell, with the look's own title, description and card) and
    # `GET /look/<id>.json` is what the app reads to wear it. One service, one
    # process, one origin — a look is never fetched from anyone else's host.
    #
    # The page location carries the page header set (script-src 'self', and the
    # shell is what answers if the service is down). The share call is answered
    # no-store: it writes.
    location ^~ /look/ {
        proxy_pass http://127.0.0.1:3220;
        proxy_set_header Host fiddy.fun;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_http_version 1.1;
        proxy_read_timeout 15s;
        proxy_hide_header x-content-type-options;
        proxy_hide_header Cache-Control;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; media-src 'self' blob: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https: wss:; frame-src 'self' https:; object-src 'none'; base-uri 'self'; form-action 'self'" always;
        set $fiddy_cache_control "public, max-age=300, no-transform";
        if ($uri ~* \.json$) { set $fiddy_cache_control "public, max-age=300"; }
        add_header Cache-Control $fiddy_cache_control always;
        error_page 502 503 504 = @fiddy_shell;
    }
    location = /look {
        proxy_pass http://127.0.0.1:3220;
        proxy_set_header Host fiddy.fun;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_http_version 1.1;
        proxy_read_timeout 15s;
        proxy_hide_header x-content-type-options;
        proxy_hide_header Cache-Control;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; media-src 'self' blob: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https: wss:; frame-src 'self' https:; object-src 'none'; base-uri 'self'; form-action 'self'" always;
        add_header Cache-Control "no-store" always;
        client_max_body_size 8k;
        error_page 502 503 504 = @fiddy_shell;
    }
    location ^~ /unfurl/ {
        proxy_pass http://127.0.0.1:3220;
        proxy_set_header Host fiddy.fun;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 15s;
        proxy_hide_header x-content-type-options;
        proxy_hide_header Cache-Control;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Cache-Control "public, max-age=300" always;
        error_page 502 503 504 = @fiddy_shell;
    }
    # The app itself, unchanged: the shell this release ships.
    location @fiddy_shell {
        try_files /index.html =404;
    }